spack:
  specs:
  - access-om2
  packages:
    cice5:
      require:
      - '@git.2023.10.19=access-om2'
    mom5:
      require:
      - '@git.2023.11.09=access-om2'
    libaccessom2:
      require:
      - '@git.2023.10.26=access-om2'
    oasis3-mct:
      require:
      - '@git.2023.11.09=access-om2'
    netcdf-c:
      require:
      - '@4.7.4'
    netcdf-fortran:
      require:
      - '@4.5.2'
    parallelio:
      require:
      - '@2.5.2'
    openmpi:
      require:
      - '@4.0.2'
    all:
      require:
      - '%intel@19.0.5.281'
      - target=x86_64
  view: true
  concretizer:
    unify: true
  modules:
    default:
      tcl:
        include:
        - access-om2
        - mom5
        - cice5
        - libaccessom2
        - oasis3-mct
        projections:
          access-om2: '{name}/pr12-12'
          mom5: 'access-om2/.dependencies/pr12-12/{name}/2023.11.09-{hash:7}'
  repos::
  - /some/spack-packages
  - $spack/var/spack/repos/builtin
