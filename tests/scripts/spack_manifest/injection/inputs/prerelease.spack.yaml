# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  # add package specs to the `specs` list
  definitions:
  - _name: [access-om2]
  - _version: [2024.03.0]
  - _spack-version: ['1.1']
  - _provenance: [mom5]
  - _injection: []
  specs:
  - access-om2
  packages:
    cice5:
      require:
      - '@git.2023.10.19=access-om2'
    mom5:
      require:
      - '@git.2023.11.09=access-om2'
    libaccessom2:
      require:
      - '@git.2023.10.26=access-om2'
    oasis3-mct:
      require:
      - '@git.2023.11.09=access-om2'
    netcdf-c:
      require:
      - '@4.7.4'
    netcdf-fortran:
      require:
      - '@4.5.2'
    parallelio:
      require:
      - '@2.5.2'
    openmpi:
      require:
      - '@4.0.2'
    all:
      require:
      - '%intel@19.0.5.281'
      - 'target=x86_64'
  view: true
  concretizer:
    unify: true
  modules:
    default:
      tcl:
        include:
        - access-om2
        - mom5
        - cice5
        - libaccessom2
        - oasis3-mct
        projections:
          access-om2: '{name}/2024.03.0'
          mom5: '{name}/2023.11.09-{hash:7}'
  repos:
    access_spack_packages:
      git: https://github.com/ACCESS-NRI/access-spack-packages.git
      tag: 2026.05.001
      destination: $env/.package_repos/access-spack-packages