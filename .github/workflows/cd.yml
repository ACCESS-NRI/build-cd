name: CD
run-name: ${{ inputs.model }} CD
# NOTE: This workflow requires:
# permissions.contents:write
# secrets:inherit with an appropriate GitHub Environment for deployment in the caller
on:
  workflow_call:
    inputs:
      model:
        type: string
        required: true
        description: The human-readable model name that is being tested and deployed
      spack-manifest-path:
        type: string
        required: false
        default: spack.yaml
        description: |
          The Spack manifest path relative to the caller repository that will be used for the deployment.
          This is usually `spack.yaml`, but can be overridden if needed.
      tag-deployment:
        type: boolean
        required: false
        default: true
        description: |
          Whether to tag the deployment with the root spec ref and create a release.
          NOTE: Setting this to false is not recommended for model deployments.
      upload-to-build-db:
        type: boolean
        required: false
        default: true
        description: |
          Whether to upload the deployment information to the build database (requires tag-deployment to also be true).
          NOTE: Setting this to false is not recommended for model deployments.
      spack-manifest-schema-path:
        type: string
        required: false
        default: au.org.access-nri/model/spack/environment/deployment
        description: |
          The path to the Spack manifest schema directory relative to the ACCESS-NRI/schema repository.
      spack-manifest-schema-version:
        type: string
        required: true
        description: |
          The version of the Spack manifest schema to use for validation, from the ACCESS-NRI/schema repository.
      config-versions-schema-version:
        type: string
        required: true
        description: |
          The version of the config/versions.json schema to use for validation, from the ACCESS-NRI/schema repository.
      config-packages-schema-version:
        type: string
        required: true
        description: |
          The version of the config/packages.json schema to use for validation, from the ACCESS-NRI/schema repository.
  # Callers usually have the trigger:
  # push:
  #   branches:
  #     - main
  #     - backport/*.*
  #   paths:
  #     - config/**
  #     - spack.yaml

env:
  METADATA_PATH: /opt/metadata
  OUTPUTS_PATH: /opt/outputs
jobs:
  init:
    name: Initialize Deployment
    runs-on: ubuntu-latest
    outputs:
      deployment-name: ${{ steps.manifest.outputs.deployment-name }}
      targets: ${{ steps.target.outputs.valid-targets }}
    steps:
      - uses: actions/checkout@v6

      - name: Checkout build-cd
        uses: actions/checkout@v6
        with:
          repository: access-nri/build-cd
          ref: ${{ job.workflow_sha }}
          path: _build-cd

      - name: Get manifest
        id: manifest
        uses: ./_build-cd/.github/actions/get-spack-manifest
        with:
          spack-manifest-path: ${{ inputs.spack-manifest-path }}

      - name: Generate Deployment Target Matrix
        id: target
        uses: ./_build-cd/.github/actions/get-target-matrix
        with:
          targets: ${{ vars.RELEASE_DEPLOYMENT_TARGETS }}

  verify-settings:
    name: Verify Deployment Settings
    runs-on: ubuntu-latest
    needs:
      - init
    strategy:
      matrix:
        target: ${{ fromJson(needs.init.outputs.targets) }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: access-nri/build-cd
          ref: ${{ job.workflow_sha }}

      - uses: ./.github/actions/validate-deployment-settings
        with:
          settings-path: ./config/settings.json
          target: ${{ matrix.target }}
          error-level: error

  get-deployment-version:
    name: Get Deployment Version
    runs-on: ubuntu-latest
    needs:
      - verify-settings
    outputs:
      version: ${{ steps.manifest.outputs.deployment-version }}
    steps:
      - uses: actions/checkout@v6

      - name: Checkout build-cd
        uses: actions/checkout@v6
        with:
          repository: access-nri/build-cd
          ref: ${{ job.workflow_sha }}
          path: _build-cd

      - name: Get Deployment Version
        id: manifest
        uses: ./_build-cd/.github/actions/get-spack-manifest
        with:
          spack-manifest-path: ${{ inputs.spack-manifest-path }}

  push-tag:
    name: Tag Deployment
    if: inputs.tag-deployment
    runs-on: ubuntu-latest
    needs:
      - get-deployment-version
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Import Commit-Signing Key
        uses: crazy-max/ghaction-import-gpg@01dd5d3ca463c7f10f7f4f7b4f177225ac661ee4  # v6.1.0
        with:
          gpg_private_key: ${{ secrets.GH_ACTIONS_BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GH_ACTIONS_BOT_GPG_PASSPHRASE }}
          git_config_global: true
          git_committer_name: ${{ vars.GH_ACTIONS_BOT_GIT_USER_NAME }}
          git_committer_email: ${{ vars.GH_ACTIONS_BOT_GIT_USER_EMAIL }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Push Tag
        env:
          TAG: ${{ needs.get-deployment-version.outputs.version }}
        run: |
          git tag ${{ env.TAG }} -m "Deployment of ${{ inputs.model }} ${{ env.TAG }} via build-cd 'cd.yml' workflow"
          git push --tags

  deploy-release:
    name: Deploy Release
    needs:
      - init
      - get-deployment-version
      - push-tag
    # Pushing tags is optional if we are doing a non-model deployment
    if: >-
      always() &&
      needs.init.result == 'success' &&
      needs.get-deployment-version.result == 'success' &&
      (needs.push-tag.result == 'success' || needs.push-tag.result == 'skipped')
    strategy:
      matrix:
        target: ${{ fromJson(needs.init.outputs.targets) }}
    uses: ./.github/workflows/deploy.yml
    with:
      deployment-target: ${{ matrix.target }}
      deployment-ref: ${{ github.ref_name }}
      deployment-type: Release
      deployment-version: ${{ needs.get-deployment-version.outputs.version }}
      spack-manifest-path: ${{ inputs.spack-manifest-path }}
      expected-root-spec-name: ${{ needs.init.outputs.deployment-name }}
      spack-manifest-schema-path: ${{ inputs.spack-manifest-schema-path }}
      spack-manifest-schema-version: ${{ inputs.spack-manifest-schema-version }}
      config-versions-schema-version: ${{ inputs.config-versions-schema-version }}
      config-packages-schema-version: ${{ inputs.config-packages-schema-version }}
    secrets: inherit
    permissions:
      contents: write
      # We require pull-requests:write despite not using it in this path,
      # because it is needed by the pull_request invocation of the workflow.
      pull-requests: write

  release:
    name: Create Release
    if: inputs.tag-deployment
    needs:
      - init
      - get-deployment-version
      - push-tag
      - deploy-release
    runs-on: ubuntu-latest
    env:
      TEMPLATED_RELEASE_BODY_PATH: /opt/release-body.md
    steps:
      - name: Checkout build-cd
        uses: actions/checkout@v6
        with:
          repository: access-nri/build-cd
          ref: ${{ job.workflow_sha }}

      - name: Download Metadata Artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ needs.deploy-release.outputs.general-metadata-artifact-glob }}
          path: ${{ env.METADATA_PATH }}
          merge-multiple: true

      - name: Download Outputs Artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ needs.deploy-release.outputs.general-outputs-artifact-glob }}
          path: ${{ env.OUTPUTS_PATH }}
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q -q -r scripts/jinja_template/requirements.txt

      - name: Generate Release Notes
        id: release-body
        env:
          J2_MODEL: ${{ inputs.model }}
          J2_VERSION: ${{ needs.get-deployment-version.outputs.version }}
          J2_ROOT_SBD: ${{ needs.init.outputs.deployment-name }}
        run: |
          python -m scripts.jinja_template.render_deployment_info \
            --template scripts/jinja_template/templates/release-body.md.j2 \
            --deployment-outputs ${{ env.OUTPUTS_PATH }} \
            --output ${{ env.TEMPLATED_RELEASE_BODY_PATH }}

      - name: Create Release
        uses: softprops/action-gh-release@69320dbe05506a9a39fc8ae11030b214ec2d1f87  # v2.0.5
        with:
          tag_name: ${{ needs.get-deployment-version.outputs.version }}
          name: ${{ inputs.model}} ${{ needs.get-deployment-version.outputs.version }}
          body_path: ${{ env.TEMPLATED_RELEASE_BODY_PATH }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ env.METADATA_PATH }}/*.spack.yaml
            ${{ env.METADATA_PATH }}/*.spack.lock
            ${{ env.METADATA_PATH }}/*.spack.location

  build-db:
    name: Build DB Metadata Upload
    if: inputs.tag-deployment && inputs.upload-to-build-db
    needs:
      - init
      - deploy-release
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Download Metadata Artifact
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ needs.deploy-release.outputs.general-metadata-artifact-glob }}
          path: ${{ env.METADATA_PATH }}
          merge-multiple: true

      - name: Download Outputs Artifact
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ needs.deploy-release.outputs.general-outputs-artifact-glob }}
          path: ${{ env.OUTPUTS_PATH }}
          merge-multiple: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ vars.PYTHON_VERSION }}
          cache: pip

      - name: Checkout Upload Script
        uses: actions/checkout@v6
        with:
          repository: access-nri/build-cd
          ref: ${{ job.workflow_sha }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/release_provenance/requirements.txt

      - name: Run Upload Script
        env:
          TRACKING_SERVICES_POST_URL: ${{ vars.TRACKING_SERVICES_POST_URL }}
          TRACKING_SERVICES_POST_TOKEN: ${{ secrets.TRACKING_SERVICES_POST_TOKEN }}
          TRACKING_SERVICES_REPO_FETCH_TOKEN: ${{ secrets.TRACKING_SERVICES_REPO_FETCH_TOKEN }}
        run: |
          python -m scripts.release_provenance.tracking_services_data \
            --repository ${{ github.repository }} \
            --root-spec ${{ needs.init.outputs.deployment-name }} \
            --deployment-outputs ${{ env.OUTPUTS_PATH }} \
            --metadata-outputs ${{ env.METADATA_PATH }} \
            --upload
