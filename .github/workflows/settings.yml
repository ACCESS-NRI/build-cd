name: Config Settings Update
on:
  push:
    # Below condition is enforced by the `if` condition in
    # the `setup-settings-update` job:
    # branches:
    #   - $default_branch
    paths:
      - config/settings.*
  pull_request:
    paths:
      - config/settings.*
env:
  CONFIG_SETTINGS_PATH: ./config/settings.json
  CONFIG_SETTINGS_SCHEMA_PATH: ./config/settings.schema.json
jobs:
  setup-settings-validation:
    name: Setup Validate Deployment Settings
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.target.outputs.targets }}
    steps:
      - name: Get deployment settings.json
        uses: actions/checkout@v6
        with:
          repository: access-nri/build-cd

      - name: Generate Deployment Target Matrix
        id: target
        run: |
          targets=$(jq --compact-output '.deployment | keys' config/settings.json)
          echo "$targets"
          echo "targets=$targets" >> $GITHUB_OUTPUT

  settings-validation:
    name: Validate Deployment Settings
    needs:
      - setup-settings-validation
    strategy:
      matrix:
        target: ${{ fromJson(needs.setup-settings-validation.outputs.targets) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout settings.json
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ vars.PYTHON_VERSION }}

      - name: Validate settings.json against Schema
        run: jsonschema --instance ${{ env.CONFIG_SETTINGS_PATH }} ${{ env.CONFIG_SETTINGS_SCHEMA_PATH }}

      - name: Validate Deployment Settings
        id: validate
        uses: access-nri/build-cd/.github/actions/validate-deployment-settings@v8
        with:
          settings-path: ${{ env.CONFIG_SETTINGS_PATH }}
          target: ${{ matrix.target }}

      - name: Comment Validation Issues
        if: steps.validate.outputs.failures != '' && github.event_name == 'pull_request'
        uses: access-nri/actions/.github/actions/pr-comment@main
        with:
          comment: |
            :warning: `${{ env.CONFIG_SETTINGS_PATH }}`: Inconsistencies detected with the `${{ matrix.target }}` configuration. See below. :warning:
            ${{ steps.validate.outputs.failures }}

  setup-settings-update:
    name: Setup Update of Deployment Settings
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs:
      - settings-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      updates: ${{ steps.info.outputs.updates }}
    steps:
      - uses: actions/checkout@v6

      - name: Collect Deployment Information
        id: info
        # Essentially, we are getting the config/settings.json into a form
        # that can be understood by the later matrix job.
        # A matrix job will need something of the form (but in yaml):
        # {
        #  "deployment-environment": "Gadi",
        #  "type": "Release"
        # }
        # TODO: Add back in the ...spack json object as an input to the next job
        run: |
          update=$(jq --raw-output --compact-output \
            '[.deployment | to_entries[] | .key as $d | .value | keys[] | {
                "deployment-environment": $d,
                "type": .
              }]' ${{ env.CONFIG_SETTINGS_PATH }}
          )
          echo "updates=$update" >> $GITHUB_OUTPUT

  settings-link-run:
    name: Link Workflow Run To PR
    if: github.event_name == 'push'
    needs:
      - setup-settings-update
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: Get merged PR number
        id: pr
        # Get the most-recently merged PR and comment the workflow run link
        run: |
          last_merged_pr_number=$(gh pr list \
            --state merged \
            --json 'number,mergedAt' \
            --jq 'sort_by(.mergedAt) | last | .number'
          )
          gh pr view $last_merged_pr_number
          echo "number=$last_merged_pr_number" >> $GITHUB_OUTPUT

      - name: Comment on PR ${{ steps.pr.outputs.number }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        uses: access-nri/actions/.github/actions/pr-comment@main
        with:
          pr: ${{ steps.pr.outputs.number }}
          comment: |-
            :information_source: The deployment of the merged settings update can be found here: ${{ env.RUN_URL }} :information_source:

  settings-update:
    name: Update ${{ matrix.update.deployment-environment }} ${{ matrix.update.type }} Settings
    if: github.event_name == 'push'
    needs:
      - setup-settings-update
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        update: ${{ fromJson(needs.setup-settings-update.outputs.updates) }}
        # Example of this matrix:
        # update:
        # - deployment-environment: Gadi
        #   type: Release
        # - deployment-environment: Gadi
        #   type: Prerelease
        # etc ...
    runs-on: ubuntu-latest
    environment: ${{ matrix.update.deployment-environment }} ${{ matrix.update.type }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup spack updates
        id: spack
        # TODO: Since we can't format any of this later json as an input for this job (see the earlier workflow) we need to do it here
        # Create a newline-separated list of strings of the form "MAJOR_VERSION COMMIT_HASH" so we
        # update the remotes MAJOR_VERSION/spack to COMMIT_HASH. Ex: "0.20 y7834gtbf3jf3434rr34r34ru"
        run: |
          updates=$(jq --compact-output --raw-output \
            --arg env "${{ matrix.update.deployment-environment }}" \
            --arg type "${{ matrix.update.type }}" \
            '.deployment[$env][$type] | to_entries[] | "\(.key) \(.value.spack)"' \
            ${{ env.CONFIG_SETTINGS_PATH }}
          )

          echo "$updates"
          # For multiline output, use a heredoc. See https://github.com/orgs/community/discussions/116619#discussioncomment-8994849
          echo "updates<<EOF" >> $GITHUB_OUTPUT
          echo "$updates" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Setup spack-config updates
        id: spack-config
        run: |
          updates=$(jq --compact-output --raw-output \
            --arg env "${{ matrix.update.deployment-environment }}" \
            --arg type "${{ matrix.update.type }}" \
            '.deployment[$env][$type] | to_entries[] | "\(.key) \(.value."spack-config")"' \
            ${{ env.CONFIG_SETTINGS_PATH }}
          )

          echo "$updates"
          # For multiline output, use a heredoc. See https://github.com/orgs/community/discussions/116619#discussioncomment-8994849
          echo "updates<<EOF" >> $GITHUB_OUTPUT
          echo "$updates" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Setup SSH
        id: ssh
        uses: access-nri/actions/.github/actions/setup-ssh@main
        with:
          hosts: ${{ secrets.HOST }}
          private-key: ${{ secrets.SSH_KEY }}

      - name: Update Spack
        continue-on-error: true
        run: |
          ssh ${{ secrets.USER}}@${{ secrets.HOST }} -i ${{ steps.ssh.outputs.private-key-path }} /bin/bash <<'EOT'
          set +e
          while read -ra update; do
            version=${update[0]}
            new_commit=${update[1]}
            current_head_commit=$(git -C ${{ secrets.SPACK_INSTALLS_ROOT_LOCATION }}/$version/spack rev-parse HEAD)

            if [ $? -eq 128 ]; then
              # FIXME: Deploy spack instances in this job too.
              echo "::error::Error: ${{ matrix.update.deployment-environment }} ${{ matrix.update.type }} $version spack does not exist. Deploy it via build-cds Create Deployment Spack workflow first."
              continue
            fi

            git -C ${{ secrets.SPACK_INSTALLS_ROOT_LOCATION }}/$version/spack fetch

            if [[ "$current_head_commit" != "$new_commit" ]]; then
              git -C ${{ secrets.SPACK_INSTALLS_ROOT_LOCATION }}/$version/spack checkout $new_commit
              if [ $? -ne 0 ]; then
                echo "::error::Error: ${{ matrix.update.deployment-environment }} ${{ matrix.update.type }} $version spack failed checkout from $current_head_commit to $new_commit"
              else
                echo "::notice::Changed: ${{ matrix.update.deployment-environment }} ${{ matrix.update.type }} $version spack changed from $current_head_commit to $new_commit"
              fi
            else
              echo "::notice::Unchanged: ${{ matrix.update.deployment-environment }} ${{ matrix.update.type }} $version spack left at $current_head_commit"
            fi
          done <<< "${{ steps.spack.outputs.updates }}"
          EOT

      - name: Update spack-config
        continue-on-error: true
        run: |
          ssh ${{ secrets.USER}}@${{ secrets.HOST }} -i ${{ steps.ssh.outputs.private-key-path }} /bin/bash <<'EOT'
          set +e
          while read -ra update; do
            version=${update[0]}
            new_tag=${update[1]}

            current_head_commit=$(git -C ${{ secrets.SPACK_INSTALLS_ROOT_LOCATION }}/$version/spack-config rev-parse HEAD)

            if [ $? -eq 128 ]; then
              echo "::error::Error: ${{ matrix.update.deployment-environment }} ${{ matrix.update.type }} $version spack-config does not exist."
              continue
            fi

            git -C ${{ secrets.SPACK_INSTALLS_ROOT_LOCATION }}/$version/spack-config fetch

            # Parse the above spack-config tag as a commit hash, for easy comparison. The '^{}' syntax gives the hash of the tagged commit, not the hash of the tag itself
            new_commit=$(git -C ${{ secrets.SPACK_INSTALLS_ROOT_LOCATION }}/$version/spack-config rev-parse "${new_tag}^{}")

            if [[ "$current_head_commit" != "$new_commit" ]]; then
              git -C ${{ secrets.SPACK_INSTALLS_ROOT_LOCATION }}/$version/spack-config checkout $new_tag
              if [ $? -ne 0 ]; then
                echo "::error::Error: ${{ matrix.update.deployment-environment }} ${{ matrix.update.type }} $version spack-config failed checkout from $current_head_commit to $new_commit"
              else
                echo "::notice::Changed: ${{ matrix.update.deployment-environment }} ${{ matrix.update.type }} $version spack-config changed from $current_head_commit to $new_commit"

                module use ${{ vars.ADMIN_MODULES_DIR }}
                module load spack/$version
                spack repo update
              fi

            else
              echo "::notice::Unchanged: ${{ matrix.update.deployment-environment }} ${{ matrix.update.type }} $version spack-config left at $current_head_commit"
            fi
          done <<< "${{ steps.spack-config.outputs.updates }}"
          EOT
