name: Comment Command
run-name: ${{ inputs.model }} Comment Command

# NOTE: This workflow requires:
# permissions.contents:write
# permissions.pull-requests:write

on:
  workflow_call:
    inputs:
      model:
        type: string
        required: true
        description: The model that is being tested and deployed
      spack-manifest-path:
        type: string
        required: false
        default: spack.yaml
        description: Path the the spack manifest in the caller
  # Callers usually have the trigger:
  # issue_comment:
  #   types:
  #     - created
  #     - edited
env:
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
jobs:
  bump-version:
    name: Bump spack.yaml
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '!bump')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check commenter permissions
        id: commenter
        # This must happen before any checkout, since the steps below check out the
        # (untrusted) PR head using a privileged token.
        uses: access-nri/actions/.github/actions/commenter-permission-check@main
        with:
          # This means that commenters who use `!bump` must have at least `write` perms
          # in the repository. `write` is probably the best fit.
          minimum-permission: write

      - name: React to Comment
        uses: access-nri/actions/.github/actions/react-to-comment@main
        with:
          token: ${{ github.token }}
          reaction: ${{ steps.commenter.outputs.has-permission == 'true' && 'rocket' || '-1' }}

      - name: Exit if no write permissions
        if: steps.commenter.outputs.has-permission == 'false'
        run: |
          echo "::error::User ${{ github.event.comment.user.login }} doesn't have 'write' permission on ${{ github.repository }}, not allowing version bump"
          exit 1

      - name: Get branch from issue
        id: issue
        # We have to do a bit more interrogation of the issue number to get the branch name to check out
        run: echo "branch=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRefName --jq .headRefName)" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.issue.outputs.branch }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GH_COMMIT_CHECK_TOKEN }}

      - name: Checkout build-cd
        uses: actions/checkout@v6
        with:
          repository: access-nri/build-cd
          ref: ${{ job.workflow_sha }}
          path: build-cd

      - name: Original version
        id: original
        uses: ./build-cd/.github/actions/get-spack-manifest
        with:
          spack-manifest-path: ${{ inputs.spack-manifest-path }}

      - name: Setup
        id: setup
        # outputs:
        #   version: The version that will be bumped (could be latest tag instead of original-version)
        #   bump: The bump type (major, minor or current as specified in the bump-version action)
        env:
          # Untrusted input - must never be interpolated directly into the script below
          COMMENT_BODY: ${{ github.event.comment.body }}
          ORIGINAL_VERSION: ${{ steps.original.outputs.deployment-version }}
        run: |
          if [[ "${{ contains(github.event.comment.body, 'major') }}" == "true" ]]; then
            # Compare the current date (year-month) with the latest git tag (year-month)
            # to determine the next valid tag. We do this because especially feature-rich
            # months might increment the date part beyond the current date.

            d="$(date +%Y-%m)-01"
            d_s=$(date --date "$d" +%s)

            latest_tag=$(git describe --tags --abbrev=0 | tr '.' '-')
            tag_date=${latest_tag%-*}-01
            tag_date_s=$(date --date "$tag_date" +%s)

            echo "Comparing current date ${d} with ${tag_date} (tag looks like ${latest_tag})"

            if (( d_s <= tag_date_s )); then
              echo "version=${tag_date}" >> $GITHUB_OUTPUT
              echo "bump=major" >> $GITHUB_OUTPUT
            else
              echo "version=$ORIGINAL_VERSION" >> $GITHUB_OUTPUT
              echo "bump=current" >> $GITHUB_OUTPUT
            fi
          elif [[ "${{ contains(github.event.comment.body, 'minor')}}" == "true" ]]; then
            echo "version=$ORIGINAL_VERSION" >> $GITHUB_OUTPUT
            echo "bump=minor" >> $GITHUB_OUTPUT
          else
            echo "::warning::Usage: '!bump [major|minor]', got '$COMMENT_BODY'"
            exit 1
          fi

      - name: Bump Version
        id: bump
        uses: access-nri/actions/.github/actions/bump-version@main
        with:
          version: ${{ steps.setup.outputs.version }}
          versioning-scheme: calver-minor
          bump-type: ${{ steps.setup.outputs.bump }}

      - name: Import Commit-Signing Key
        uses: crazy-max/ghaction-import-gpg@01dd5d3ca463c7f10f7f4f7b4f177225ac661ee4  # v6.1.0
        with:
          gpg_private_key: ${{ secrets.GH_ACTIONS_BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GH_ACTIONS_BOT_GPG_PASSPHRASE }}
          git_config_global: true
          git_committer_name: ${{ vars.GH_ACTIONS_BOT_GIT_USER_NAME }}
          git_committer_email: ${{ vars.GH_ACTIONS_BOT_GIT_USER_EMAIL }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Update, Commit and Push the Bump
        env:
          ORIGINAL_VERSION: ${{ steps.original.outputs.deployment-version }}
          NEW_VERSION: ${{ steps.bump.outputs.after }}
        run: |
          # Substituting via `sed` on the `_version` line only, rather than assigning with `yq` as `yq` doesn't handle this correctly.
          # This finds lines that start with '- _version:', and substitutes the original version (escaping regex '.') with the new version.
          sed -i -E "/^[[:space:]]*-[[:space:]]*_version:/s/${ORIGINAL_VERSION//./\\.}/${NEW_VERSION}/" ${{ inputs.spack-manifest-path }}

          # Validate that the new version was set appropriately.
          if [[ "$(yq '.spack.definitions[] | select(has("_version")) | ._version[0]' ${{ inputs.spack-manifest-path }})" != "$NEW_VERSION" ]]; then
            echo "::error::Failed to update the _version reserved definition in ${{ inputs.spack-manifest-path }}"
            exit 1
          fi

          git add ${{ inputs.spack-manifest-path }}
          git commit -m "${{ inputs.spack-manifest-path }}: Updated deployment version from ${{ steps.original.outputs.deployment-version }} to ${{ steps.bump.outputs.after }}"
          git push

      - name: Success Notifier
        uses: access-nri/actions/.github/actions/pr-comment@main
        with:
          comment: |
            :white_check_mark: ${{ inputs.spack-manifest-path }} version bumped from `${{ steps.original.outputs.deployment-version }}` to `${{ steps.bump.outputs.after }}` :white_check_mark:

      - name: Failure Notifier
        if: failure()
        uses: access-nri/actions/.github/actions/pr-comment@main
        with:
          comment: |
            :x: Failed to bump version or commit changes to ${{ inputs.spack-manifest-path }}, see ${{ env.RUN_URL }} :x:
