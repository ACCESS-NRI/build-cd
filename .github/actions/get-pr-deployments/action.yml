name: Get PR Deployments
description: Action that returns how many deployments were made in a PR (both from commits and !redeploys)
author: Tommy Gatti
inputs:
  pr:
    required: true
    description: The pull request number to check for deployments of all kinds
  repository:
    required: false
    default: ${{ github.repository }}
    description: The repository to check for deployments
  token:
    required: false
    default: ${{ github.token }}
    description: The GitHub token to use for API requests
outputs:
  deployments:
    description: The total number of deployments for the given PR (from commits and !redeploys)
    value: ${{ steps.total.outputs.number }}
runs:
  using: composite
  # Essentially, count all the deployment entries that match the given branch, as well as
  # all the `!redeploy` comments, to get the next deployment number.
  # See https://docs.github.com/en/rest/deployments/deployments?apiVersion=2022-11-28#list-deployments
  steps:
    - name: Get PR HEAD
      id: pr
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR: ${{ inputs.pr }}
        REPOSITORY: ${{ inputs.repository }}
      run: |
        head=$(gh pr view "$PR" --repo "$REPOSITORY" --json headRefName --jq .headRefName)
        echo "HEAD of PR #${PR} in ${REPOSITORY} is $head"
        echo "head=$head" >> $GITHUB_OUTPUT

    - name: Get commit deployments for PR
      id: commit
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR: ${{ inputs.pr }}
        REPOSITORY: ${{ inputs.repository }}
        # Untrusted: passed to jq via --arg, never interpolated into the jq program
        HEAD_REF: ${{ steps.pr.outputs.head }}
      # We --slurp the results because --paginate introduces potentially multiple array results
      run: |
        deployments=$(gh api \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            --paginate --slurp \
            "/repos/${REPOSITORY}/deployments" \
          | jq --arg head "$HEAD_REF" '[select(.[][].ref == $head)] | length'
        )
        echo "Found $deployments deployments for PR #${PR} in ${REPOSITORY}"
        echo "deployments=$deployments" >> $GITHUB_OUTPUT

    - name: Get !redeploys from comments
      id: comment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR: ${{ inputs.pr }}
        REPOSITORY: ${{ inputs.repository }}
      run: |
        redeployments=$(gh pr view "$PR" --repo "$REPOSITORY" \
          --json comments \
          --jq '[.comments[] | select(.body | startswith("!redeploy"))] | length'
        )
        echo "Found $redeployments redeploy comments for PR #${PR} in ${REPOSITORY}"
        echo "redeployments=$redeployments" >> $GITHUB_OUTPUT

    - name: Return total deployments
      id: total
      shell: bash
      env:
        PR: ${{ inputs.pr }}
        REPOSITORY: ${{ inputs.repository }}
        COMMIT_DEPLOYMENTS: ${{ steps.commit.outputs.deployments }}
        COMMENT_REDEPLOYMENTS: ${{ steps.comment.outputs.redeployments }}
      run: |
        total=$(( COMMIT_DEPLOYMENTS + COMMENT_REDEPLOYMENTS ))
        echo "Found $total deployments across commits (${COMMIT_DEPLOYMENTS}) and redeploys (${COMMENT_REDEPLOYMENTS}) for PR #${PR} in ${REPOSITORY}"
        echo "number=$total" >> $GITHUB_OUTPUT
