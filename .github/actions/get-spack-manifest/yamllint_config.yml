extends: default
rules:
  line-length:
    max: 120
    level: warning
  indentation:
    spaces: consistent
    indent-sequences: consistent
    check-multi-line-strings: true
  comments-indentation: {}
  truthy:
    allowed-values: ['true', 'false']
    check-keys: false
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 0
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 0